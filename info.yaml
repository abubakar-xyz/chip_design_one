# Tiny Tapeout project information
project:
  title:        "Adaptive Traffic Light Controller with Emergency Override"
  author:       "abubakar-xyz"
  discord:      ""      # Your discord username (optional)
  description:  "Adaptive FSM-based traffic light controller with sensor-driven timing and emergency vehicle override"
  language:     "Verilog"
  clock_hz:     10000   # 10 kHz clock

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_traffic_ctrl"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "traffic_fsm.v"
    - "tt_um_traffic_ctrl.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "ns_sensor"
  ui[1]: "ew_sensor"
  ui[2]: "emergency"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "ns_red"
  uo[1]: "ns_yellow"
  uo[2]: "ns_green"
  uo[3]: "ew_red"
  uo[4]: "ew_yellow"
  uo[5]: "ew_green"
  uo[6]: "emergency_led"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
